server:
  port: 8090
  shutdown: graceful

spring:
  application:
    name: webserver-oracle
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@127.0.0.1:1521/xe
    username: insung
    password: 12345678

mybatis:
  mapper-locations: classpath*:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

aws:
  s3:
    endpoint: http://localhost:9000
    tempPath: /workspace/temp/
    bucketName: s3-storage
    access: minioadmin
    secret: minioadmin
    streamPath: enters3path

jwt:
  # Base64 encoded secret key (at least 256 bits). Replace with your own in real usage.
  secret: dGhpc19pc19hX3NhbXBsZV9qd3Rfc2VjcmV0X2tleV9mb3JfZGVtbw==
  expiration-seconds: 3600
